title: PanDao — Лендинг
'@extends':
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      fields:
        contacts:
          type: tab
          title: Контакты PanDao
          fields:
            header.pandao.phone_display:
              type: text
              label: Телефон (как показывать)
              default: '+7 (985) 071-01-01'
            header.pandao.phone_raw:
              type: text
              label: Телефон (для ссылки tel:)
              default: '+79850710101'
            header.pandao.email:
              type: text
              label: Email
              default: 'pandaologistics@gmail.com'
            header.pandao.whatsapp:
              type: text
              label: WhatsApp (только цифры, напр. 79850710101)
              default: '79850710101'
            header.pandao.telegram:
              type: text
              label: Telegram (логин без @)
              default: 'pandaologistics'
            header.pandao.address:
              type: text
              label: Адрес в Китае
            header.pandao.hours:
              type: text
              label: Часы работы
              default: 'Пн–Сб • 9:00 до 18:00 (МСК)'
